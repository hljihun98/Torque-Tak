<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사이트 이전 안내 · SMART MAINTENANCE</title>
  <link rel="canonical" href="https://hljihun98.github.io/SMART_MAINTENANCE/">
  <meta name="robots" content="noindex">
  <!-- JS가 꺼진 환경용: 5초 후 이동 -->
  <noscript><meta http-equiv="refresh" content="5; url=https://hljihun98.github.io/SMART_MAINTENANCE/"></noscript>
  <style>
    /* 화이트 톤 고정 (다크모드에서도 흰 화면 유지) */
    :root {
      color-scheme: light;
      --bg: #ffffff; --card: #ffffff; --soft: #f5f7fa; --text: #1d2433; --muted: #5b6577;
      --accent: #0b5cd5; --accent-hover: #0849ab; --track: #edf0f5; --border: #e6eaf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }
    .card {
      width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px 28px; text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    .badge {
      display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .02em;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
      padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
    }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { margin: 0 0 6px; color: var(--muted); line-height: 1.6; font-size: 15px; }
    .new-url {
      display: block; margin: 16px 0 20px; padding: 10px 12px; border-radius: 8px;
      background: var(--soft); color: var(--text); font-size: 13px; word-break: break-all;
      font-family: ui-monospace, Consolas, monospace;
    }
    .bar { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
    .bar > span {
      display: block; height: 100%; width: 0; background: var(--accent);
      animation: fill 5s linear forwards;
    }
    @keyframes fill { to { width: 100%; } }
    .count { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .count b { color: var(--text); }
    .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 11px 20px; border-radius: 10px; font-size: 15px;
      font-weight: 600; text-decoration: none; cursor: pointer; border: 0;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .tip { margin-top: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">사이트 이전 안내</span>
    <h1>Torque-Tak이 SMART MAINTENANCE로 통합되었습니다</h1>
    <p>앞으로는 아래 새 주소에서 이용해 주세요.</p>
    <code class="new-url">hljihun98.github.io/SMART_MAINTENANCE/</code>

    <div class="bar"><span id="bar"></span></div>
    <div class="count" id="count"><b id="sec">5</b>초 후 자동으로 이동합니다</div>

    <div class="actions">
      <a class="btn btn-primary" id="go" href="https://hljihun98.github.io/SMART_MAINTENANCE/">지금 이동</a>
      <a class="btn btn-ghost" href="legacy.html">기존 계산기 계속 쓰기</a>
    </div>

    <p class="tip">즐겨찾기를 새 주소로 바꿔 두시면 편합니다.</p>
  </main>

  <script>
    var TARGET = "https://hljihun98.github.io/SMART_MAINTENANCE/" + location.search + location.hash;
    var left = 5;
    var secEl = document.getElementById("sec");
    document.getElementById("go").href = TARGET;

    var timer = setInterval(function () {
      left -= 1;
      if (left <= 0) {
        clearInterval(timer);
        location.replace(TARGET); // 뒤로가기 시 안내 페이지를 다시 거치지 않음
      } else {
        secEl.textContent = left;
      }
    }, 1000);
  </script>
</body>
</html>
